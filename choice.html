<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💕 你愿意吗？</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 30%, #ffecd2 60%, #fcb69f 100%);
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* 飘落的爱心背景 */
  .hearts-bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .heart-float {
    position: absolute;
    font-size: 20px;
    animation: floatUp linear infinite;
    opacity: 0.5;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0.6; }
    100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
  }

  /* 主卡片 */
  .card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 32px;
    padding: 48px 40px 40px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 80, 100, 0.3);
    border: 2px solid rgba(255, 200, 210, 0.5);
    transition: all 0.3s ease;
  }

  .title {
    font-size: 28px;
    font-weight: 700;
    color: #d6336c;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 16px;
    color: #e8688a;
    margin-bottom: 32px;
    line-height: 1.6;
  }

  /* 爱心大表情 */
  .big-heart {
    font-size: 64px;
    display: block;
    margin-bottom: 20px;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* 按钮容器 */
  .btn-group {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
    min-height: 100px;
    flex-wrap: wrap;
  }

  /* 喜欢按钮 */
  .btn-yes {
    background: linear-gradient(135deg, #ff6b8a, #ff3b6f);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 36px;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 60, 100, 0.4);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
    min-width: 120px;
    position: relative;
    z-index: 2;
  }

  .btn-yes:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 30px rgba(255, 60, 100, 0.5);
  }

  .btn-yes:active {
    transform: scale(0.95);
  }

  /* 不喜欢按钮 */
  .btn-no {
    background: rgba(200, 200, 200, 0.3);
    color: #999;
    border: 1.5px solid rgba(200, 200, 200, 0.5);
    border-radius: 50px;
    padding: 12px 30px;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
    min-width: 100px;
    position: relative;
    z-index: 1;
  }

  .btn-no:hover {
    background: rgba(200, 200, 200, 0.5);
  }

  /* 消息区域 */
  .message {
    margin-top: 28px;
    min-height: 50px;
    font-size: 18px;
    font-weight: 600;
    color: #d6336c;
    transition: all 0.4s ease;
  }

  .count-display {
    margin-top: 12px;
    font-size: 14px;
    color: #e8688a;
  }

  /* 最终彩蛋 */
  .final-cute {
    display: none;
    margin-top: 20px;
  }

  .final-cute.show {
    display: block;
    animation: fadeInUp 0.6s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .final-text {
    font-size: 22px;
    font-weight: 700;
    color: #d6336c;
    line-height: 1.8;
  }

  .emoji-row {
    font-size: 36px;
    margin: 10px 0;
  }

  /* 点击闪光特效 */
  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 24px;
    z-index: 999;
    animation: sparkleFade 0.8s ease-out forwards;
  }

  @keyframes sparkleFade {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.3); }
  }

  /* 用方框包裹文字的样式 */
  .text-box {
    display: inline-block;
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 12px;
    border: 2px solid #f8a5b8;
    box-shadow: 0 2px 10px rgba(255, 150, 180, 0.2);
  }
</style>
</head>
<body>

<!-- 飘落的爱心 -->
<div class="hearts-bg" id="heartsBg"></div>

<!-- 主卡片 -->
<div class="card" id="card">
  <span class="big-heart">💖</span>
  <div class="title">亲爱的 ❤️</div>
  <div class="subtitle">
    <span class="text-box">你愿意和我在一起吗？</span>
  </div>

  <div class="btn-group" id="btnGroup">
    <button class="btn-yes" id="btnYes" onclick="likeMe()">❤️ 喜欢</button>
    <button class="btn-no" id="btnNo" onclick="dontLikeMe()">不喜欢 💔</button>
  </div>

  <div class="message" id="message">💕 点一下上面的按钮吧</div>
  <div class="count-display" id="countDisplay"></div>

  <div class="final-cute" id="finalCute">
    <div class="emoji-row">🥰💕🥰💕🥰</div>
    <div class="final-text">
      我就知道你会选这个！<br>
      我也最喜欢你啦 💗<br>
      <span style="font-size:28px;">我们要一直在一起哦～</span>
    </div>
    <div class="emoji-row">💑🌈✨🌹🎉</div>
  </div>

  <a href="index.html" style="display:inline-block; margin-top:20px; color:#e8688a; text-decoration:none; font-size:14px; padding:8px 20px; border:1.5px dashed #e8688a; border-radius:20px;">❤️ 返回首页</a>
</div>

<script>
  // 生成飘落的爱心
  function createHearts() {
    const container = document.getElementById('heartsBg');
    const emojis = ['❤️', '💕', '💗', '💖', '🌸', '🌹', '✨', '💝'];
    for (let i = 0; i < 25; i++) {
      const el = document.createElement('div');
      el.className = 'heart-float';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.fontSize = (14 + Math.random() * 20) + 'px';
      el.style.animationDuration = (8 + Math.random() * 12) + 's';
      el.style.animationDelay = (Math.random() * 15) + 's';
      container.appendChild(el);
    }
  }
  createHearts();

  let yesScale = 1;
  let noScale = 1;
  let yesCount = 0;
  let noCount = 0;
  let hasWon = false;

  const btnYes = document.getElementById('btnYes');
  const btnNo = document.getElementById('btnNo');
  const message = document.getElementById('message');
  const countDisplay = document.getElementById('countDisplay');
  const finalCute = document.getElementById('finalCute');

  // 闪光特效
  function createSparkle(x, y, emoji) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.textContent = emoji || '✨';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  function likeMe() {
    if (hasWon) return;

    yesCount++;
    yesScale += 0.12;
    noScale -= 0.04;

    // 喜欢按钮变大
    btnYes.style.transform = 'scale(' + yesScale + ')';
    btnYes.style.fontSize = (20 * yesScale) + 'px';
    btnYes.style.padding = (14 * yesScale) + 'px ' + (36 * yesScale) + 'px';

    // 不喜欢按钮变小
    if (noScale > 0.1) {
      btnNo.style.transform = 'scale(' + noScale + ')';
      btnNo.style.fontSize = (18 * noScale) + 'px';
      btnNo.style.padding = (12 * noScale) + 'px ' + (30 * noScale) + 'px';
      btnNo.style.minWidth = (100 * noScale) + 'px';
    }

    // 让卡片也变温暖
    document.getElementById('card').style.boxShadow = '0 20px 60px rgba(255, 80, 100, ' + (0.3 + yesCount * 0.03) + ')';

    // 闪光
    const rect = btnYes.getBoundingClientRect();
    createSparkle(rect.left + rect.width/2, rect.top, '💕');
    createSparkle(rect.right - 10, rect.bottom - 10, '✨');

    // 随机消息
    const msgs = [
      '🥰 我就知道～', '💗 再喜欢我一点！', '❤️ 好开心！', '💖 我也喜欢你！',
      '😊 你真好～', '🌟 最喜欢你啦！', '💕 再点一下嘛～', '🥺 好感动...',
      '💝 你是最棒的！', '✨ 我的心是妳的了！'
    ];
    message.textContent = msgs[Math.floor(Math.random() * msgs.length)];

    // 更新计数
    countDisplay.textContent = '❤️ 喜欢了 ' + yesCount + ' 次 | 💔 还剩下 ' + Math.round(1 / Math.max(noScale, 0.01)) + ' 次不喜欢的机会';

    if (yesCount >= 5 && !hasWon) {
      hasWon = true;
      message.textContent = '🎉🎉🎉 太好了！🎉🎉🎉';
      countDisplay.textContent = '';
      btnNo.style.display = 'none';
      finalCute.classList.add('show');

      // 庆祝烟花效果
      let fireworks = 0;
      const fw = setInterval(() => {
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        createSparkle(x, y, '🎉');
        createSparkle(x + 20, y - 30, '🎊');
        createSparkle(x - 20, y + 10, '💖');
        createSparkle(x + 10, y + 20, '🌹');
        fireworks++;
        if (fireworks > 30) clearInterval(fw);
      }, 200);
    }
  }

  function dontLikeMe() {
    if (hasWon) return;

    noCount++;
    noScale -= 0.12;
    yesScale += 0.03;

    // 不喜欢按钮缩小
    if (noScale > 0.05) {
      btnNo.style.transform = 'scale(' + noScale + ')';
      btnNo.style.fontSize = (18 * noScale) + 'px';
      btnNo.style.padding = (12 * noScale) + 'px ' + (30 * noScale) + 'px';
      btnNo.style.minWidth = (100 * noScale) + 'px';
    }

    // 喜欢按钮偷偷变大
    btnYes.style.transform = 'scale(' + yesScale + ')';

    // 按钮逃跑——越来越难点到
    if (noScale < 0.5 && noScale > 0.1) {
      const maxMove = 60;
      const moveX = (Math.random() - 0.5) * maxMove;
      const moveY = (Math.random() - 0.5) * maxMove;
      btnNo.style.transform += ' translate(' + moveX + 'px, ' + moveY + 'px)';
    }

    // 表情
    const rect = btnNo.getBoundingClientRect();
    createSparkle(rect.left + rect.width/2, rect.top + rect.height/2, '😢');

    // 消息
    const sadMsgs = [
      '😢 你...你认真的吗？', '🥺 再想想嘛～', '😭 呜呜我好难过',
      '💔 我的心碎了啦', '😤 我不信！再点一次试试？', '🥹 别这样嘛...',
      '😣 好受伤...', '💦 眼泪要出来了'
    ];
    message.textContent = sadMsgs[Math.floor(Math.random() * sadMsgs.length)];

    if (noScale <= 0.05) {
      btnNo.style.display = 'none';
      message.textContent = '😏 嘿嘿，没得选了～ 只能点喜欢我了！';
    }

    countDisplay.textContent = '❤️ 喜欢了 ' + yesCount + ' 次 | 💔 不喜欢的按钮快消失了...';
  }
</script>

</body>
</html>
