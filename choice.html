<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>💕 情侣小决定</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(135deg,#ffd6e0 0%,#ffb3c6 25%,#ffc8d6 50%,#ff9eb5 75%,#ffb3c6 100%);background-size:400% 400%;animation:gf 12s ease infinite;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;position:relative}
@keyframes gf{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hb{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:0}.hb-i{position:absolute;font-size:18px;animation:hF linear infinite;opacity:.3}
@keyframes hF{0%{transform:translateY(-60px) rotate(0deg);opacity:.4}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
.card{position:relative;z-index:1;max-width:440px;width:100%;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-radius:28px;padding:28px 24px;box-shadow:0 8px 32px rgba(255,80,120,.12);margin-bottom:20px;text-align:center}
.title{font-size:26px;font-weight:700;color:#d6336c;margin-bottom:2px}.sub{font-size:14px;color:#e8688a;margin-bottom:28px}
.sel{position:relative;margin-bottom:24px}.sr{display:flex;gap:12px;align-items:center;margin-bottom:14px}.si{flex:1;text-align:center}.sl{font-size:12px;color:#b06a80;margin-bottom:4px}.sv{font-size:20px;font-weight:700;color:#d6336c;min-height:30px}.vs{font-size:24px;color:#e8688a}.btn{display:block;width:100%;padding:16px;border:none;border-radius:50px;font-size:18px;font-weight:600;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1)}.btn:active{transform:scale(.95)}.btn-pk{background:linear-gradient(135deg,#ff6b8a,#ff3b6f);color:#fff;box-shadow:0 6px 24px rgba(255,60,100,.3);margin-bottom:12px}.btn-pk:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(255,60,100,.4)}.btn-rr{background:rgba(255,255,255,.6);color:#e8688a;border:1.5px solid rgba(255,107,138,.3);margin-bottom:20px}.btn-rr:hover{background:rgba(255,255,255,.8)}
.result{font-size:22px;font-weight:600;color:#d6336c;padding:16px;background:rgba(255,240,245,.5);border-radius:16px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px}
.ha{text-align:left;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,200,215,.3)}.hl{font-size:14px;font-weight:600;color:#d6336c;margin-bottom:10px;display:flex;align-items:center;gap:6px}.hl a{margin-left:auto;font-size:12px;color:#e8688a;cursor:pointer;text-decoration:underline;font-weight:400}
.hlist{display:flex;flex-wrap:wrap;gap:8px}.htag{background:rgba(255,230,240,.6);border-radius:20px;padding:4px 12px;font-size:13px;color:#c95a7a}.he{color:#ccc;font-size:13px}
.bl{display:block;text-align:center;color:#e8688a;text-decoration:none;font-size:14px;padding:12px 0}.bl:hover{color:#d6336c}
@media(max-width:400px){.card{padding:20px 16px}.title{font-size:22px}}
</style></head><body>
<div class="hb" id="hb"></div>
<div class="card">
<div class="title">💕 情侣小决定</div>
<div class="sub">让上天帮你们做决定吧~😏</div>
<div class="sel"><div class="sr"><div class="si"><div class="sl">你</div><div class="sv" id="p1v">♻</div></div><div class="vs">VS</div><div class="si"><div class="sl">TA</div><div class="sv" id="p2v">♻</div></div></div>
<div class="sr"><input id="p1i" placeholder="你想做的..." maxlength="20" style="flex:1;padding:10px 14px;border:1.5px solid rgba(255,200,215,.3);border-radius:12px;font-size:14px;outline:none;background:rgba(255,255,255,.6);min-width:0"><input id="p2i" placeholder="TA想做的..." maxlength="20" style="flex:1;padding:10px 14px;border:1.5px solid rgba(255,200,215,.3);border-radius:12px;font-size:14px;outline:none;background:rgba(255,255,255,.6);min-width:0"></div>
<div class="sr"><button class="btn btn-pk" onclick="pk()">🎭 开始决定！</button></div>
<div class="result" id="r">🤩 点击开始吧~</div>
<div class="ha"><div class="hl">📋 历史记录<a onclick="ch()">清空</a></div><div class="hlist" id="hl"></div></div>
</div>
<a href="index.html" class="bl">💕 返回首页</a>
<script>
var ca=[🎲,🔥,🍀,🌈,🎀,🎉,🎊,💋,🌟,✨];
var his=[];
function pk(){var a=document.getElementById("p1i").value.trim()||"这个";var b=document.getElementById("p2i").value.trim()||"那个";var w=Math.random()<.5?[a,b]:[b,a];document.getElementById("p1v").innerHTML=w[0];document.getElementById("p2v").innerHTML=w[1];var em=ca[Math.floor(Math.random()*ca.length)];document.getElementById("r").innerHTML=em+" 决定啦！"+(Math.random()<.5?"去"+w[0]+"吧！":"选"+w[1]+"吧！");var entry="❓ "+a+" vs "+b+" → "+(Math.random()<.5?a:b);his.push(entry);rh();sh();}
function rh(){var h=document.getElementById("hl");h.innerHTML="";for(var i=Math.max(0,his.length-20);i<his.length;i++){var t=document.createElement("span");t.className="htag";t.textContent=his[i];h.appendChild(t);}if(!his.length)h.innerHTML="<span class=\"he\">还没有记录</span>";}
function sh(){localStorage.setItem("ch",JSON.stringify(his));}function lh(){try{var h=JSON.parse(localStorage.getItem("ch"));if(h&&Array.isArray(h))his=h;rh();}catch(e){}}lh();
function ch(){if(confirm("确定清空历史记录吗？")){his=[];rh();sh();}}
var hbIt=[❤️,✨,🌸,💘,🌟,💓,🌊,💋];
function cH(){var c=document.getElementById("hb");for(var i=0;i<20;i++){var e=document.createElement("div");e.className="hb-i";e.textContent=hbIt[i%8];e.style.left=Math.random()*100+"%";e.style.animationDuration=(10+Math.random()*18)+"s";e.style.animationDelay=(Math.random()*20)+"s";c.appendChild(e);}}cH();
</script>
</body>
</html>
