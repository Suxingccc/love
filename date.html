<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>❤️ 今天去哪里约会</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#ffd6e0 0%,#ffb3c6 25%,#ffc8d6 50%,#ff9eb5 75%,#ffb3c6 100%);background-size:400% 400%;animation:gradientFlow 12s ease infinite;display:flex;justify-content:center;padding:24px 16px;position:relative}@keyframes gradientFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}.float-el{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:0}.float-item{position:absolute;font-size:20px;animation:floatDown linear infinite;opacity:.35}@keyframes floatDown{0%{transform:translateY(-80px) rotate(0deg) scale(1);opacity:.5}100%{transform:translateY(105vh) rotate(720deg) scale(.3);opacity:0}}.container{position:relative;z-index:1;max-width:520px;width:100%;margin:0 auto}.header{text-align:center;margin-bottom:28px}.header-icon{font-size:56px;display:block;margin-bottom:8px;animation:bounce 2s ease-in-out infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.header h1{font-size:28px;color:#d6336c;font-weight:700;text-shadow:0 2px 8px rgba(214,51,108,.15)}.header p{font-size:15px;color:#e8688a;margin-top:6px}.last-date{background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-radius:16px;padding:14px 18px;margin-bottom:20px;text-align:center;font-size:14px;color:#d6336c;border:1.5px solid rgba(255,180,200,.4);box-shadow:0 4px 16px rgba(255,80,120,.08)}.last-date span{font-weight:700}.quote-bar{background:rgba(255,255,255,.5);backdrop-filter:blur(8px);border-radius:12px;padding:10px 16px;margin-bottom:20px;text-align:center;font-size:13px;color:#c95a7a;border-left:3px solid #ff6b8a;transition:all .5s ease}.sec-label{font-size:16px;font-weight:600;color:#d6336c;margin:8px 0 14px 4px;display:flex;align-items:center;gap:8px}.sec-label::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,rgba(255,107,138,.4),transparent)}.date-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}.date-card{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-radius:20px;padding:20px 16px;text-align:center;cursor:pointer;transition:all .35s cubic-bezier(.34,1.56,.64,1);border:2px solid rgba(255,200,215,.4);box-shadow:0 4px 16px rgba(255,80,120,.06);position:relative;overflow:hidden}.date-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ff6b8a,#ff9671);transform:scaleX(0);transition:transform .3s ease}.date-card:hover{transform:translateY(-4px) scale(1.02);border-color:rgba(255,107,138,.5);box-shadow:0 12px 32px rgba(255,80,120,.18)}.date-card:hover::before{transform:scaleX(1)}.date-card:active{transform:scale(.95)}.date-card .emoji{font-size:38px;display:block;margin-bottom:8px}.date-card .name{font-size:16px;font-weight:700;color:#444;margin-bottom:4px}.date-card .desc{font-size:12px;color:#999;line-height:1.4}.date-card .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-top:8px}.badge-hot{background:#ffe0e6;color:#d6336c}.badge-new{background:#e0f4ff;color:#2a8dcf}.badge-calm{background:#e0fce0;color:#2a9d2a}.s-btn{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#ff6b8a,#ff3b6f);color:#fff;border:none;border-radius:50px;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(255,60,100,.35);transition:all .3s ease;margin-bottom:24px}.s-btn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(255,60,100,.45)}.s-btn:active{transform:scale(.97)}.back-link{display:block;text-align:center;color:#e8688a;text-decoration:none;font-size:14px;padding:8px;margin-bottom:20px}.back-link:hover{color:#d6336c}.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:100;justify-content:center;align-items:center;padding:20px;animation:fadeIn .3s ease}.modal-overlay.show{display:flex}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.modal-box{background:#fff;border-radius:28px;padding:36px 28px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:modalUp .4s cubic-bezier(.34,1.56,.64,1)}@keyframes modalUp{from{transform:translateY(40px) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}.modal-emoji{font-size:64px;margin-bottom:10px}.modal-title{font-size:22px;font-weight:700;color:#d6336c;margin-bottom:6px}.modal-sub{font-size:15px;color:#e8688a;margin-bottom:20px;line-height:1.6}.modal-stats{font-size:13px;color:#aaa;margin-bottom:20px}.modal-btns{display:flex;gap:12px;justify-content:center}.modal-btn{padding:12px 32px;border-radius:50px;font-size:16px;font-weight:600;border:none;cursor:pointer;transition:all .3s}.modal-btn.cf{background:linear-gradient(135deg,#ff6b8a,#ff3b6f);color:#fff;box-shadow:0 4px 16px rgba(255,60,100,.3)}.modal-btn.cf:hover{transform:scale(1.05)}.modal-btn.cancel{background:#f0f0f0;color:#888}.modal-btn.cancel:hover{background:#e0e0e0}.result-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;justify-content:center;align-items:center;padding:20px}.result-overlay.show{display:flex}.result-bg{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,rgba(255,107,138,.92),rgba(255,150,113,.92));animation:fadeIn .5s ease}.result-box{position:relative;z-index:1;text-align:center;animation:modalUp .6s cubic-bezier(.34,1.56,.64,1);padding:20px}.result-emoji{font-size:80px;display:block;margin-bottom:12px;animation:bounce 1.5s ease-in-out infinite}.result-title{font-size:32px;font-weight:700;color:#fff;margin-bottom:8px;text-shadow:0 2px 12px rgba(0,0,0,.1)}.result-sub{font-size:18px;color:rgba(255,255,255,.9);margin-bottom:8px}.result-msg{font-size:15px;color:rgba(255,255,255,.8);margin-bottom:24px;max-width:320px;line-height:1.6}.result-btn{padding:14px 40px;border-radius:50px;font-size:17px;font-weight:600;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.2);color:#fff;cursor:pointer;transition:all .3s;backdrop-filter:blur(4px)}.result-btn:hover{background:rgba(255,255,255,.35);transform:scale(1.05)}.cfetti{position:fixed;pointer-events:none;z-index:300;animation:cfettiFall linear forwards}@keyframes cfettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}@media (max-width:400px){.date-grid{gap:10px}.date-card{padding:16px 12px}.date-card .emoji{font-size:30px}.date-card .name{font-size:14px}.header h1{font-size:24px}}</style>
</head>
<body>
<div class="float-el" id="fc"></div>
<div class="container">
<div class="header">
<span class="header-icon">❤️</span>
<h1>今天去哪里约会？</h1>
<p>亲爱的，选一个你想去的地方吧 ✨</p>
</div>
<div class="last-date">💌 上次约会：<span id="ldt">还没有约会记录哦~</span></div>
<div class="quote-bar" id="qb">🌹 和你在一起的每一天，都是最好的约会</div>
<div class="sec-label">💫 约会选择</div>
<div class="date-grid" id="dg"></div>
<button class="s-btn" onclick="sm()">🎲 随便选一个</button>
<a href="index.html" class="back-link">❤️ 返回首页</a>
</div>
<div class="modal-overlay" id="mo">
<div class="modal-box">
<div class="modal-emoji" id="me">💕</div>
<div class="modal-title" id="mt">确定选这个吗？</div>
<div class="modal-sub" id="ms"></div>
<div class="modal-stats" id="mstats"></div>
<div class="modal-btns">
<button class="modal-btn cf" onclick="cc()">✅ 就这个啦！</button>
<button class="modal-btn cancel" onclick="cm()">再想想</button>
</div>
</div>
</div>
<div class="result-overlay" id="ro">
<div class="result-bg"></div>
<div class="result-box">
<span class="result-emoji" id="re">🎉</span>
<div class="result-title" id="rt">太好啦！❤️</div>
<div class="result-sub" id="rs"></div>
<div class="result-msg" id="rm"></div>
<button class="result-btn" onclick="cr()">💖 好的！</button>
</div>
</div>
<script>
var dOpts=[
{i:"sh",e:"🏠",n:"宅家约会",d:"窝在家看电影·做饭·打游戏",b:{t:"❤ 超温馨",c:"hot"},m:"只要和你在一起，窝在家就是全世界最幸福的事",q:"有你的地方，就是最好的约会地点"},
{i:"mv",e:"🎬",n:"看电影",d:"最新大片·爆米花·可乐",b:{t:"🔥 经典",c:"hot"},m:"黑灯瞎火的电影院，最适合偷偷牵你的手了",q:"电影好不好看不重要，重要的是身边的人是你"},
{i:"sp",e:"🛒",n:"逛街购物",d:"手牵手逛商场·买买买",b:{t:"✨ 推荐",c:"new"},m:"想给你买最好看的衣服，看你试穿时开心的样子",q:"陪你逛街三小时不喊累，这就是真爱"},
{i:"dn",e:"🍴",n:"吃大餐",d:"浪漫餐厅·烛光晚餐",b:{t:"💠 精致",c:"hot"},m:"美食和爱情，都是这世上最治愈的东西",q:"和你吃饭，每一顿都是烛光晚餐"},
{i:"am",e:"🎡",n:"游乐园",d:"摩天轮·过山车·棉花糖",b:{t:"🎲 刺激",c:"new"},m:"在摩天轮最高点许愿，希望我们能一直在一起",q:"坐过山车时抓紧我的手，一辈子不放开"},
{i:"pk",e:"🌸",n:"公园散步",d:"散步拍照·感受大自然",b:{t:"🌱 惬意",c:"calm"},m:"牵着你的手在公园里慢慢走，连风都是甜的",q:"最美的风景不是花，是看花的你"},
{i:"gm",e:"🎮",n:"打游戏",d:"一起开黑·双人小游戏",b:{t:"🎯 欢乐",c:"new"},m:"赢了你夸我厉害，输了你笑我菜，怎样都开心",q:"游戏可以输，但你不能输"},
{i:"te",e:"☕",n:"下午茶",d:"安静咖啡厅·甜品·聊天",b:{t:"🍰 甜",c:"calm"},m:"和你面对面坐着，什么也不说也觉得美好",q:"和你聊天的时间，永远过得太快"},
{i:"kt",e:"🎤",n:"KTV唱歌",d:"一起当歌王歌后·嗨唱",b:{t:"🎵 开心",c:"new"},m:"唱一首情歌给你听，歌词都是我想对你说的话",q:"你是我的主打歌，循环播放一辈子"},
{i:"tr",e:"🌊",n:"短途旅行",d:"周边城市·说走就走",b:{t:"✈ 浪漫",c:"hot"},m:"和你一起去看不一样的风景，每一幅都是最美的回忆",q:"世界那么大，我想和你一起去看看"},
];
var aM={sh:"今天就在家腐败在一起吧~我负责做饭，你负责说爱我",mv:"爆米花我买，票我买，你只负责靠在我肩膀上",sp:"今天你想买什么我都陪你！你负责美，我负责买单",dn:"订了你最喜欢的菜厅，今晚只准负责吃和笑",am:"在摩天轮最高点我会对你说一句话...你猜是什么？",pk:"带你去一个超美的公园，保证你疯狂拍照！",gm:"我准备好被你虐了！不过赢了的人要请吃夜宵哦",te:"找一家有猫的咖啡厅，边擂猫边看你，治愈一整天",kt:"我要唱《告白气球》给你听！你负责当我的最佳听众",tr:"我来做攻略，你带上好心情，我们出发吧！"};
var qts=["🌹 和你在一起的每一天，都是最好的约会","❤ ️ 想和你一起做很多很多无聊的事","✨ 你是我平淡生活里的光","🌸 只要有你在，去哪都是蜜月旅行","💘 和你一起浪费的时间，才是最珍贵的时光","🌟 你是我的「刚刚好」——刚好喜欢，刚好合适","💓 遇见你之后，每天都想谈恋爱","🌊 你的笑容，是我这辈子最想守护的东西","💋 喜欢你这件事，我打算坚持一辈子的","💫 世界很大，但我的世界里有你就够了"];
var fltIt=["❤️","✨","🌸","💘","🌟","💓","🌊","💋"];
var cfIt=["❤️","✨","🌸","💘","🌟","🎉","💓","🌊","💋","🎊"];
function rq(){return qts[Math.floor(Math.random()*qts.length)];}
function cfe(){var c=document.getElementById("fc");for(var i=0;i<20;i++){var e=document.createElement("div");e.className="float-item";e.textContent=fltIt[i%8];e.style.left=Math.random()*100+"%";e.style.fontSize=(12+Math.random()*20)+"px";e.style.animationDuration=(10+Math.random()*18)+"s";e.style.animationDelay=Math.random()*20+"s";c.appendChild(e);}}cfe();
function gh(){try{return JSON.parse(localStorage.getItem("dh")||"{}")}catch(e){return{}}}function sc(i,n){var h=gh();if(!h[i])h[i]={cnt:0,ld:null};h[i].cnt++;h[i].ld=(new Date()).toISOString();localStorage.setItem("dh",JSON.stringify(h));localStorage.setItem("ld",JSON.stringify({i:i,n:n,t:(new Date()).toISOString()}))}
function gld(){try{var l=JSON.parse(localStorage.getItem("ld"));if(l&&l.n){var d=Math.floor((Date.now()-new Date(l.t))/86400000);return d==0?"刚刚选了 "+l.n:d==1?"昨天选了 "+l.n:d+"天前选了 "+l.n;}return"还没有约会记录哦~";}
function gs(i){var h=gh();if(h[i]&&h[i].cnt>0){var he="";for(var j=0;j<Math.min(h[i].cnt,5);j++)he+="❤️";return"这是第 "+h[i].cnt+" 次选这个啦 "+he;}return"第一次选这个呢！✨";}
function rd(){var g=document.getElementById("dg");g.innerHTML="";for(var i=0;i<dOpts.length;i++){var o=dOpts[i];var c=document.createElement("div");c.className="date-card";c.innerHTML="<span class=\"emoji\">"+o.e+"</span><div class=\"name\">"+o.n+"</div><div class=\"desc\">"+o.d+"</div><span class=\"badge badge-"+o.b.c+"\">"+o.b.t+"</span>;(function(idx){c.addEventListener("click",function(){om(dOpts[idx].i)});})(i);g.appendChild(c);}}rd();document.getElementById("ldt").innerHTML=gld();
var ci=null;function om(i){ci=i;var o=dOpts.find(function(e){return e.i===i});if(!o)return;document.getElementById("me").textContent=o.e;document.getElementById("mt").innerHTML="确定选【"+o.n+"】吗？";document.getElementById("ms").innerHTML=o.m;document.getElementById("mstats").innerHTML=gs(i);document.getElementById("mo").classList.add("show");}
function cm(){document.getElementById("mo").classList.remove("show");ci=null;}function cc(){if(!ci)return;var o=dOpts.find(function(e){return e.i===ci});if(!o)return;sc(ci,o.n);cm();document.getElementById("re").textContent=o.e;document.getElementById("rt").innerHTML="太好啦！❤️";document.getElementById("rs").innerHTML="今天我们就去【"+o.n+"】吧！";document.getElementById("rm").innerHTML=aM[ci]||o.m;document.getElementById("ro").classList.add("show");lcf();document.getElementById("ldt").innerHTML=gld();document.getElementById("qb").innerHTML=o.q||rq();ci=null;}
function cr(){document.getElementById("ro").classList.remove("show");document.getElementById("qb").innerHTML=rq();}function sm(){var r=dOpts[Math.floor(Math.random()*dOpts.length)];om(r.i);}
function lcf(){for(var i=0;i<40;i++){setTimeout(function(){var el=document.createElement("div");el.className="cfetti";el.textContent=cfIt[Math.floor(Math.random()*cfIt.length)];el.style.left=Math.random()*100+"vw";el.style.fontSize=(14+Math.random()*24)+"px";el.style.animationDuration=(2+Math.random()*3)+"s";document.body.appendChild(el);setTimeout(function(){el.remove()},5000);},i*60);}}
setInterval(function(){var qb=document.getElementById("qb");if(qb)qb.innerHTML=rq();},30000);
document.getElementById("mo").addEventListener("click",function(e){if(e.target===e.currentTarget)cm();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){cm();cr();}});
</script>
</body>
</html>
