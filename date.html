    el.style.fontSize = (12 + Math.random() * 20) + 'px';
    el.style.animationDuration = (10 + Math.random() * 18) + 's';
    el.style.animationDelay = (Math.random() * 20) + 's';
    container.appendChild(el);
  }
}
createFloatElements();

function getHistory() { try { return JSON.parse(localStorage.getItem('dateHistory') || '{}'); } catch(e) { return {}; } }

function saveChoice(id, name) {
  var h = getHistory();
  if (!h[id]) h[id] = {name:name, count:0, lastDate:null};
  h[id].count++; h[id].lastDate = new Date().toISOString();
  localStorage.setItem('dateHistory', JSON.stringify(h));
  localStorage.setItem('lastDate', JSON.stringify({id:id, name:name, time:new Date().toISOString()}));
}

function getLastDate() {
  try {
    var last = JSON.parse(localStorage.getItem('lastDate'));
    if (last && last.name) {
      var days = Math.floor((Date.now() - new Date(last.time)) / 86400000);
      if (days === 0) return '&#21018;&#21018;&#36873;&#20102; ' + last.name + ' &#128149;';
      if (days === 1) return '&#26152;&#22825;&#36873;&#20102; ' + last.name + ' &#128149;';
      return days + ' &#22825;&#21069;&#36873;&#20102; ' + last.name;
    }
  } catch(e) {}
  return '&#36824;&#27809;&#26377;&#32422;&#20250;&#35760;&#24405;&#21734;~';
}

function getStats(id) {
  var h = getHistory();
  if (h[id] && h[id].count > 0) {
    return '&#36825;&#26159;&#31532; ' + h[id].count + ' &#27425;&#36873;&#36825;&#20010;&#21862; ' + Array(Math.min(h[id].count,5)+1).join('&#128149;');
  }
  return '&#31532;&#19968;&#27425;&#36873;&#36825;&#20010;&#21602;&#65281;&#10024;';
}

function renderDates() {
  var grid = document.getElementById('dateGrid');
  grid.innerHTML = '';
  for (var i = 0; i < dateOptions.length; i++) {
    var opt = dateOptions[i];
    var card = document.createElement('div');
    card.className = 'date-card';
    card.innerHTML = '<span class="emoji">' + opt.emoji + '</span><div class="name">' + opt.name + '</div><div class="desc">' + opt.desc + '</div><span class="badge ' + opt.badge.c + '">' + opt.badge.text + '</span>';
    (function(id) { card.addEventListener('click', function() { openModal(id); }); })(opt.id);
    grid.appendChild(card);
  }
}
renderDates();
document.getElementById('lastDateText').textContent = getLastDate();

var currentId = null;

function openModal(id) {
  currentId = id;
  for (var i = 0; i < dateOptions.length; i++) {
    if (dateOptions[i].id === id) {
      var opt = dateOptions[i];
      document.getElementById('modalEmoji').textContent = opt.emoji;
      document.getElementById('modalTitle').textContent = '&#30830;&#23450;&#36873;&#12302;' + opt.name + '&#12303;&#21527;&#65311;';
      document.getElementById('modalSub').textContent = opt.msg;
      document.getElementById('modalStats').textContent = getStats(id);
      document.getElementById('modalOverlay').classList.add('show');
      break;
    }
  }
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); currentId = null; }

function confirmChoice() {
  if (!currentId) return;
  var opt = null;
  for (var i = 0; i < dateOptions.length; i++) {
    if (dateOptions[i].id === currentId) { opt = dateOptions[i]; break; }
  }
  if (!opt) return;
  saveChoice(currentId, opt.name);
  closeModal();
  document.getElementById('resultEmoji').textContent = opt.emoji;
  document.getElementById('resultTitle').textContent = '&#22826;&#22909;&#21862;&#65281;&#128149;';
  document.getElementById('resultSub').textContent = '&#20170;&#22825;&#25105;&#20204;&#23601;&#21435;&#12302;' + opt.name + '&#12303;&#21543;&#65281;';
  document.getElementById('resultMsg').textContent = activityMessages[currentId] || opt.msg;
  document.getElementById('resultOverlay').classList.add('show');
  launchConfetti();
  document.getElementById('lastDateText').textContent = getLastDate();
  document.getElementById('quoteBar').textContent = opt.quote || randomQuote();
  currentId = null;
}

function closeResult() {
  document.getElementById('resultOverlay').classList.remove('show');
  document.getElementById('quoteBar').textContent = randomQuote();
}

function surpriseMe() {
  var r = dateOptions[Math.floor(Math.random() * dateOptions.length)];
  openModal(r.id);
}

function launchConfetti() {
  var emojis = ['&#128149;','&#10024;','&#127800;','&#128152;','&#127775;','&#127881;','&#128151;','&#127802;','&#129411;','&#127882;'];
  for (var i = 0; i < 40; i++) {
    (function(idx) {
      setTimeout(function() {
        var el = document.createElement('div');
        el.className = 'confetti';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = (14 + Math.random() * 24) + 'px';
        el.style.animationDuration = (2 + Math.random() * 3) + 's';
        document.body.appendChild(el);
        setTimeout(function() { el.remove(); }, 5000);
      }, idx * 60);
    })(i);
  }
}

setInterval(function() {
  var qb = document.getElementById('quoteBar');
  if (qb) qb.textContent = randomQuote();
}, 30000);

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === e.currentTarget) closeModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeModal(); closeResult(); }
});
</script>
</body>
