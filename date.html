var quotes=["\ud83c\udf39 \u548c\u4f60\u5728\u4e00\u8d77\u7684\u6bcf\u4e00\u5929\uff0c\u90fd\u662f\u6700\u597d\u7684\u7ea6\u4f1a","\u2764\ufe0f \u60f3\u548c\u4f60\u4e00\u8d77\u505a\u5f88\u591a\u5f88\u591a\u65e0\u804a\u7684\u4e8b","\u2728 \u4f60\u662f\u6211\u5e73\u6de1\u751f\u6d3b\u91cc\u7684\u5149","\ud83c\udf38 \u53ea\u8981\u6709\u4f60\u5728\uff0c\u53bb\u54ea\u90fd\u662f\u871c\u6708\u65c5\u884c","\ud83d\udc98 \u548c\u4f60\u4e00\u8d77\u6d6a\u8d39\u7684\u65f6\u95f4\uff0c\u624d\u662f\u6700\u73cd\u8d35\u7684\u65f6\u5149","\ud83c\udf1f \u4f60\u662f\u6211\u7684\u300c\u521a\u521a\u597d\u300d\u2014\u2014\u521a\u597d\u559c\u6b22\uff0c\u521a\u597d\u5408\u9002","\ud83d\udc93 \u9047\u89c1\u4f60\u4e4b\u540e\uff0c\u6bcf\u5929\u90fd\u60f3\u8c08\u604b\u7231","\ud83c\udf0a \u4f60\u7684\u7b11\u5bb9\uff0c\u662f\u6211\u8fd9\u8f88\u5b50\u6700\u60f3\u5b88\u62a4\u7684\u4e1c\u897f","\ud83d\udc8b \u559c\u6b22\u4f60\u8fd9\u4ef6\u4e8b\uff0c\u6211\u6253\u7b97\u575a\u6301\u4e00\u8f88\u5b50\u7684","\ud83d\udcab \u4e16\u754c\u5f88\u5927\uff0c\u4f46\u6211\u7684\u4e16\u754c\u91cc\u6709\u4f60\u5c31\u591f\u4e86"];
function rq(){return quotes[Math.floor(Math.random()*quotes.length)];}
function cfe(){var c=document.getElementById("floatContainer"),it=["\u2764\ufe0f","\u2728","\ud83c\udf38","\ud83d\udc98","\ud83c\udf1f","\ud83d\udc93","\ud83c\udf0a","\ud83d\udc8b"];for(var i=0;i<20;i++){var e=document.createElement("div");e.className="float-item";e.textContent=it[i%it.length];e.style.left=Math.random()*100+"%";e.style.fontSize=(12+Math.random()*20)+"px";e.style.animationDuration=(10+Math.random()*18)+"s";e.style.animationDelay=(Math.random()*20)+"s";c.appendChild(e);}}
cfe();
function gh(){try{return JSON.parse(localStorage.getItem("dateHistory")||"{}")}catch(e){return{};}}
function sc(id,nm){var h=gh();if(!h[id])h[id]={name:nm,count:0,lastDate:null};h[id].count++;h[id].lastDate=new Date().toISOString();localStorage.setItem("dateHistory",JSON.stringify(h));localStorage.setItem("lastDate",JSON.stringify({id:id,name:nm,time:new Date().toISOString()}));}
function gld(){try{var l=JSON.parse(localStorage.getItem("lastDate"));if(l&&l.name){var d=Math.floor((Date.now()-new Date(l.time))/86400000);if(d===0)return"\u521a\u521a\u9009\u4e86 "+l.name+" \u2764\ufe0f";if(d===1)return"\u6628\u5929\u9009\u4e86 "+l.name+" \u2764\ufe0f";return d+" \u5929\u524d\u9009\u4e86 "+l.name;}}catch(e){}return"\u8fd8\u6ca1\u6709\u7ea6\u4f1a\u8bb0\u5f55\u54e6~";}
function gs(id){var h=gh();if(h[id]&&h[id].count>0){var he="";for(var i=0;i<Math.min(h[id].count,5);i++)he+="\u2764\ufe0f";return"\u8fd9\u662f\u7b2c "+h[id].count+" \u6b21\u9009\u8fd9\u4e2a\u5566 "+he;}return"\u7b2c\u4e00\u6b21\u9009\u8fd9\u4e2a\u5462\uff01\u2728";}
function rd(){var g=document.getElementById("dateGrid");g.innerHTML="";for(var o of dateOptions){var c=document.createElement("div");c.className="date-card";c.innerHTML="<span class=\"emoji\">"+o.emoji+"</span><div class=\"name\">"+o.name+"</div><div class=\"desc\">"+o.desc+"</div><span class=\"badge "+o.badge.c+"\">"+o.badge.text+"</span>";c.addEventListener("click",function(){om(o.id)});g.appendChild(c);}}
rd();
document.getElementById("lastDateText").innerHTML=gld();
var cid=null;
function om(id){cid=id;var o=dateOptions.find(function(e){return e.id===id});if(!o)return;document.getElementById("modalEmoji").textContent=o.emoji;document.getElementById("modalTitle").innerHTML="\u786e\u5b9a\u9009\u3010"+o.name+"\u3011\u5417\uff1f";document.getElementById("modalSub").innerHTML=o.msg;document.getElementById("modalStats").innerHTML=gs(id);document.getElementById("modalOverlay").classList.add("show");}
function cm(){document.getElementById("modalOverlay").classList.remove("show");cid=null;}
function cc(){if(!cid)return;var o=dateOptions.find(function(e){return e.id===cid});if(!o)return;sc(cid,o.name);cm();document.getElementById("resultEmoji").textContent=o.emoji;document.getElementById("resultTitle").innerHTML="\u592a\u597d\u5566\uff01\u2764\ufe0f";document.getElementById("resultSub").innerHTML="\u4eca\u5929\u6211\u4eec\u5c31\u53bb\u3010"+o.name+"\u3011\u5427\uff01";document.getElementById("resultMsg").innerHTML=activityMessages[cid]||o.msg;document.getElementById("resultOverlay").classList.add("show");lcf();document.getElementById("lastDateText").innerHTML=gld();document.getElementById("quoteBar").innerHTML=o.quote||rq();cid=null;}
function cr(){document.getElementById("resultOverlay").classList.remove("show");document.getElementById("quoteBar").innerHTML=rq();}
function sm(){var r=dateOptions[Math.floor(Math.random()*dateOptions.length)];om(r.id);}
function lcf(){var e=["\u2764\ufe0f","\u2728","\ud83c\udf38","\ud83d\udc98","\ud83c\udf1f","\ud83c\udf89","\ud83d\udc93","\ud83c\udf0a","\ud83d\udc8b","\ud83c\udf8a"];for(var i=0;i<40;i++){setTimeout(function(){var el=document.createElement("div");el.className="confetti";el.textContent=e[Math.floor(Math.random()*e.length)];el.style.left=Math.random()*100+"vw";el.style.fontSize=(14+Math.random()*24)+"px";el.style.animationDuration=(2+Math.random()*3)+"s";document.body.appendChild(el);setTimeout(function(){el.remove()},5000);},i*60);}}
setInterval(function(){var qb=document.getElementById("quoteBar");if(qb)qb.innerHTML=rq();},30000);
document.getElementById("modalOverlay").addEventListener("click",function(e){if(e.target===e.currentTarget)cm();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){cm();cr();}});
</script>
