<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🍽 今天吃什么</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(135deg,#ffd6e0 0%,#ffb3c6 25%,#ffc8d6 50%,#ff9eb5 75%,#ffb3c6 100%);background-size:400% 400%;animation:gf 12s ease infinite;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;position:relative}
@keyframes gf{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.fh{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0}.fh-i{position:absolute;animation:fF linear infinite}.fh-i:nth-child(odd){animation-duration:12s}.fh-i:nth-child(even){animation-duration:18s}
@keyframes fF{0%{transform:translateY(-40px) scale(1);opacity:.6}100%{transform:translateY(105vh) scale(.3);opacity:0}}
.card{position:relative;z-index:1;max-width:440px;width:100%;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-radius:28px;padding:28px 24px 24px;box-shadow:0 8px 32px rgba(255,80,120,.12);margin-bottom:20px}
.title{text-align:center;font-size:26px;font-weight:700;color:#d6336c;margin-bottom:2px;text-shadow:0 2px 8px rgba(214,51,108,.1)}.sub{text-align:center;font-size:14px;color:#e8688a;margin-bottom:24px}
.ww{position:relative;width:280px;height:280px;margin:0 auto 24px}canvas#wheel{width:280px;height:280px;border-radius:50%;box-shadow:0 6px 24px rgba(255,80,120,.15);border:4px solid #ffb3c6}
.ptr{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:2;font-size:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}.cd{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.15);border:2px solid #ffb3c6}
.btns{display:flex;gap:12px;margin-bottom:20px}.btn{flex:1;padding:14px;border:none;border-radius:50px;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1)}.btn:active{transform:scale(.95)}.btn-spin{background:linear-gradient(135deg,#ff6b8a,#ff3b6f);color:#fff;box-shadow:0 4px 16px rgba(255,60,100,.25)}.btn-spin:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,60,100,.35)}.btn-edit{background:rgba(255,255,255,.6);color:#d6336c;border:1.5px solid rgba(255,107,138,.3)}.btn-edit:hover{background:rgba(255,255,255,.8)}
.result{padding:14px;background:rgba(255,240,245,.5);border-radius:16px;text-align:center;font-size:22px;font-weight:600;color:#d6336c;margin-bottom:20px;min-height:52px;display:flex;align-items:center;justify-content:center}.ha{background:rgba(255,255,255,.5);border-radius:16px;padding:14px 16px;margin-bottom:4px}
.hl{font-size:14px;font-weight:600;color:#d6336c;margin-bottom:8px;display:flex;align-items:center;gap:6px}.hl a{color:#e8688a;cursor:pointer;font-weight:400;margin-left:auto;font-size:12px;text-decoration:underline}
.hlist{display:flex;flex-wrap:wrap;gap:8px}.htag{background:rgba(255,230,240,.6);border-radius:20px;padding:4px 12px;font-size:13px;color:#c95a7a;display:flex;align-items:center;gap:4px}.htag .htx{cursor:pointer}.htag .hrm{color:#ccc;cursor:pointer;font-size:11px;margin-left:4px}.htag .hrm:hover{color:#e8688a}
.ea{display:flex;gap:8px;margin-top:12px}.ea input{flex:1;padding:10px 14px;border:1.5px solid rgba(255,200,215,.4);border-radius:12px;font-size:14px;outline:none;background:rgba(255,255,255,.6)}.ea input:focus{border-color:#ff6b8a}.ea-btn{padding:10px 16px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff6b8a,#ff3b6f);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.eo{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);z-index:100;justify-content:center;align-items:center;padding:20px;animation:ff .3s ease}.eo.show{display:flex}@keyframes ff{from{opacity:0}to{opacity:1}}.ep{background:#fff;border-radius:24px;padding:24px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}.ept{font-size:18px;font-weight:600;color:#d6336c;margin-bottom:16px}.epl{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}.epli{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,240,245,.3);border-radius:12px;font-size:14px}.epli .edel{margin-left:auto;color:#ccc;cursor:pointer;font-size:12px;padding:4px}.epli .edel:hover{color:#ff3b6f}
.eaa{display:flex;gap:8px;margin-bottom:16px}.eaa input{flex:1;padding:8px 12px;border:1px solid rgba(255,200,215,.3);border-radius:10px;font-size:14px;outline:none}.eaa input:focus{border-color:#ff6b8a}.eaa button{padding:8px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,#ff6b8a,#ff3b6f);color:#fff;cursor:pointer;font-weight:600}.ec{display:flex;gap:8px;justify-content:flex-end}.ec button{padding:8px 20px;border:none;border-radius:10px;cursor:pointer;font-weight:600;transition:all .3s}.ec .es{background:linear-gradient(135deg,#ff6b8a,#ff3b6f);color:#fff}.ec .er{background:#f0f0f0;color:#888}
.bl{display:block;text-align:center;color:#e8688a;text-decoration:none;font-size:14px;padding:12px 0}.bl:hover{color:#d6336c}
@media(max-width:400px){.ww{width:220px;height:220px}canvas#wheel{width:220px;height:220px}.card{padding:20px 16px}}
</style></head><body>
<div class="fh" id="fh"></div>
<div class="card">
<div class="title">🍽 今天吃什么？</div>
<div class="sub">宝贝转一下，让命运帮你做选择 💕</div>
<div class="ww"><div class="ptr">🎯</div><canvas id="wheel" width="400" height="400"></canvas><div class="cd">❤️</div></div>
<div class="btns"><button class="btn btn-spin" id="spinBtn">🎰 转一转！</button><button class="btn btn-edit" id="editBtn">🔄 编辑</button></div>
<div class="result" id="result">🥰 等你来转哦~</div>
<div class="ha"><div class="hl">📋 历史选择<a onclick="ch()">清空</a></div><div class="hlist" id="hlist"></div></div>
<div class="ea"><input id="fi" placeholder="添加新菜品..." maxlength="20"><button class="ea-btn" onclick="ai()">添加</button></div>
</div>
<div class="eo" id="eo"><div class="ep"><div class="ept">📝 编辑菜品</div><div class="epl" id="epl"></div><div class="eaa"><input id="ei" placeholder="添加新菜品..." maxlength="20"><button onclick="ae()">添加</button></div><div class="ec"><button class="es" onclick="es()">保存</button><button class="er" onclick="ec()">取消</button></div></div></div>
<script>
var it=["🔥 烧烤","🍲 火锅","🥩 烤肉","🍚 拌饭","🍜 拉面","🌮 卷饼","🍕 披萨","🥟 饺子","🍣 寿司","🍗 炸鸡","🍜 麻辣烫","🌯 肉夹馍","🦐 海鲜","🍝 意面","🥪 三明治","🍢 炒菜"];
var cs=["#ff6b8a","#ff9671","#ffc75f","#6bcbff","#a16eff","#ff6b8a","#ff9671","#ffc75f","#6bcbff","#a16eff","#ff6b8a","#ff9671","#ffc75f","#6bcbff","#a16eff","#ff6b8a"];
var ej=["🔥","🍲","🥩","🍚","🍜","🌮","🍕","🥟","🍣","🍗","🍜","🌯","🦐","🍝","🥪","🍢"];
var his=[];var sp=false;var rot=0;
var cv=document.getElementById("wheel");var ct=cv.getContext("2d");
function cf(){var c=document.getElementById("fh");for(var i=0;i<15;i++){var e=document.createElement("div");e.className="fh-i";e.textContent=ej[i%16];e.style.left=Math.random()*100+"%";e.style.animationDelay=(Math.random()*15)+"s";e.style.fontSize=(14+Math.random()*18)+"px";c.appendChild(e);}}cf();
function dw(a){var n=it.length;var ar=2*Math.PI/n;ct.clearRect(0,0,400,400);ct.save();ct.translate(200,200);ct.rotate(a);for(var i=0;i<n;i++){var sa=i*ar;ct.beginPath();ct.moveTo(0,0);ct.arc(0,0,195,sa,sa+ar);ct.closePath();ct.fillStyle=cs[i%cs.length];ct.fill();ct.strokeStyle="rgba(255,255,255,.3)";ct.lineWidth=2;ct.stroke();ct.save();ct.rotate(sa+ar/2);ct.textAlign="right";ct.fillStyle="#fff";ct.font="bold 13px sans-serif";var t=it[i];if(t.length>6)t=t.substring(0,6)+"..";ct.fillText(t,185,5);ct.restore();}ct.restore();}
function rh(){var h=document.getElementById("hlist");h.innerHTML="";var start=Math.max(0,his.length-30);for(var i=start;i<his.length;i++){(function(idx){var t=document.createElement("span");t.className="htag";t.innerHTML='<span class="htx">'+his[idx]+'</span><span class="hrm" onclick="rm('+idx+')">✖</span>';h.appendChild(t);})(i)}if(!his.length)h.innerHTML="<span style='color:#ccc;font-size:13px'>还没有记录</span>";}
function rm(i){his.splice(i,1);rh();sh();}
function sh(){localStorage.setItem("fh",JSON.stringify(his));}function lh(){try{var h=JSON.parse(localStorage.getItem("fh"));if(h&&Array.isArray(h))his=h;rh();}catch(e){}}lh();
function ai(){var v=document.getElementById("fi").value.trim();if(!v)return;it.push(v);dw(rot);document.getElementById("fi").value="";}
function ch(){if(confirm("确定清空历史选择吗？")){his=[];rh();sh();}}
document.getElementById("spinBtn").addEventListener("click",function(){if(sp||it.length<2)return;sp=true;var n=it.length;var idx=Math.floor(Math.random()*n);var ea=2*Math.PI/n;var targetAngle=((2*Math.PI)-ea*idx)+(Math.PI/2);var totalRot=rot;totalRot+=2*Math.PI*(5+Math.random()*5);while(((totalRot-targetAngle)%(2*Math.PI))>0.01||((totalRot-targetAngle)%(2*Math.PI))< -0.01){totalRot+=0.01}var startRot=rot;var endRot=totalRot;var startTime=Date.now();var duration=3500+Math.random()*1500;function af(){var t=Math.min(1,(Date.now()-startTime)/duration);var ease=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;var current=startRot+(endRot-startRot)*ease;dw(current);if(t<1)requestAnimationFrame(af);else{sp=false;rot=endRot;dw(rot);var r=it[idx];document.getElementById("result").innerHTML=ej[idx%ej.length]+" "+r+" ❤️";his.push(r);rh();sh();}}af();});
document.getElementById("editBtn").addEventListener("click",function(){var el=document.getElementById("epl");el.innerHTML="";for(var i=0;i<it.length;i++){(function(idx){var li=document.createElement("div");li.className="epli";li.innerHTML='<span>'+it[idx]+'</span><span class="edel" onclick="er('+idx+')">✖</span>';el.appendChild(li);})(i)}document.getElementById("eo").classList.add("show");});
function er(idx){it.splice(idx,1);var el=document.getElementById("epl");el.innerHTML="";for(var i=0;i<it.length;i++){(function(ii){var li=document.createElement("div");li.className="epli";li.innerHTML='<span>'+it[ii]+'</span><span class="edel" onclick="er('+ii+')">✖</span>';el.appendChild(li);})(i)}}
function ae(){var v=document.getElementById("ei").value.trim();if(!v)return;it.push(v);var idx=it.length-1;var el=document.getElementById("epl");var li=document.createElement("div");li.className="epli";li.innerHTML='<span>'+v+'</span><span class="edel" onclick="er('+idx+')">✖</span>';el.appendChild(li);document.getElementById("ei").value="";}
function es(){document.getElementById("eo").classList.remove("show");dw(rot);document.getElementById("result").innerHTML="🥰 已保存设置~";setTimeout(function(){document.getElementById("result").innerHTML="🥰 等你来转哦~";},1500);}
function ec(){document.getElementById("eo").classList.remove("show");}
dw(0);
</script>
<a href="index.html" class="bl">💕 返回首页</a>
</body>
</html>
