<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💕 我们的甜蜜小站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(145deg, #ffd6e0, #ffb3c6, #ffc8d6);
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* 飘落爱心 */
  .hearts-bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; overflow: hidden; z-index: 0;
  }
  .heart-float {
    position: absolute;
    opacity: 0.3;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg) scale(1); opacity: 0.4; }
    100% { transform: translateY(-80px) rotate(720deg) scale(0.4); opacity: 0; }
  }

  .card {
    position: relative; z-index: 1;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(16px);
    border-radius: 32px;
    padding: 40px 28px;
    max-width: 400px;
    width: 88%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 80, 120, 0.25);
    border: 2px solid rgba(255, 200, 215, 0.5);
  }

  .title {
    font-size: 26px;
    font-weight: 700;
    color: #d6336c;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 14px;
    color: #e8688a;
    margin-bottom: 28px;
  }

  .tools {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .tool-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 20px;
    padding: 18px 20px;
    text-decoration: none;
    transition: all 0.3s ease;
    border: 2px solid transparent;
  }
  .tool-card:hover {
    transform: scale(1.02);
    border-color: rgba(214, 51, 108, 0.3);
    box-shadow: 0 8px 24px rgba(255, 60, 100, 0.15);
  }

  .tool-icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .icon-choice { background: linear-gradient(135deg, #ff6b8a, #ff3b6f); }
  .icon-food { background: linear-gradient(135deg, #ff9671, #ffc75f); }

  .tool-info { text-align: left; }
  .tool-name {
    font-size: 17px;
    font-weight: 700;
    color: #444;
    margin-bottom: 3px;
  }
  .tool-desc {
    font-size: 13px;
    color: #999;
  }

  .footer-text {
    margin-top: 24px;
    font-size: 13px;
    color: #ccc;
  }
</style>
</head>
<body>
  <div class="hearts-bg" id="hearts"></div>

  <div class="card">
    <div class="title">💕 我们的甜蜜小站</div>
    <div class="subtitle">属于我俩的小工具 ✨</div>

    <div class="tools">
      <a href="choice.html" class="tool-card">
        <div class="tool-icon icon-choice">❤️</div>
        <div class="tool-info">
          <div class="tool-name">💌 表白页</div>
          <div class="tool-desc">要不要做我女朋友？💕</div>
        </div>
        <span style="color:#d6336c;font-size:20px;">→</span>
      </a>

      <a href="food.html" class="tool-card">
        <div class="tool-icon icon-food">🍽️</div>
        <div class="tool-info">
          <div class="tool-name">🎡 今天吃什么</div>
          <div class="tool-desc">美食轮盘，帮选择困难症的我们</div>
        </div>
        <span style="color:#d6336c;font-size:20px;">→</span>
      </a>
    </div>

    <div class="footer-text">🥰 更多小工具持续添加中…</div>
  </div>

<script>
  // 生成背景爱心
  const container = document.getElementById('hearts');
  const emojis = ['❤️', '💕', '💗', '💖', '🌸', '✨', '💝'];
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('div');
    el.className = 'heart-float';
    el.textContent = emojis[i % emojis.length];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (12 + Math.random() * 18) + 'px';
    el.style.animationDuration = (10 + Math.random() * 15) + 's';
    el.style.animationDelay = (Math.random() * 20) + 's';
    container.appendChild(el);
  }
</script>
</body>
</html>
